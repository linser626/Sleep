server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wechat_clone?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: wechat_clone_secret_key_2024_jwt_token
  expiration: 86400000

logging:
  level:
    com.example.wechat: DEBUG